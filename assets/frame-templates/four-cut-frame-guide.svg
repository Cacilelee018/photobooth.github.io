<svg xmlns="http://www.w3.org/2000/svg" width="960" height="4514" viewBox="0 0 960 4514">
  <defs>
    <linearGradient id="guideBackground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e8f4"/>
      <stop offset="1" stop-color="#d9bedf"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#795584" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="4514" fill="url(#guideBackground)"/>
  <rect width="960" height="4514" fill="url(#grid)"/>
  <rect x="20" y="20" width="920" height="4474" fill="none" stroke="#55345f" stroke-width="2"/>

  <g font-family="Arial, sans-serif" fill="#3c2445">
    <text x="80" y="82" font-size="34" font-weight="700">FOUR-CUT FRAME TEMPLATE</text>
    <text x="80" y="122" font-size="20">Canvas 960 x 4514 px / Photo slots 800 x 1000 px</text>
    <text x="80" y="158" font-size="18">Keep the four photo areas transparent in the final PNG.</text>
  </g>

  <g fill="#25162d" fill-opacity="0.86" stroke="#8f67a0" stroke-width="2">
    <rect x="80" y="236" width="800" height="1000"/>
    <rect x="80" y="1262" width="800" height="1000"/>
    <rect x="80" y="2288" width="800" height="1000"/>
    <rect x="80" y="3314" width="800" height="1000"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#ffffff">
    <text x="480" y="710" font-size="34" font-weight="700">PHOTO 01</text>
    <text x="480" y="754" font-size="22">X 80 / Y 236 / 800 x 1000 px</text>
    <text x="480" y="1736" font-size="34" font-weight="700">PHOTO 02</text>
    <text x="480" y="1780" font-size="22">X 80 / Y 1262 / 800 x 1000 px</text>
    <text x="480" y="2762" font-size="34" font-weight="700">PHOTO 03</text>
    <text x="480" y="2806" font-size="22">X 80 / Y 2288 / 800 x 1000 px</text>
    <text x="480" y="3788" font-size="34" font-weight="700">PHOTO 04</text>
    <text x="480" y="3832" font-size="22">X 80 / Y 3314 / 800 x 1000 px</text>
  </g>

  <g fill="#3c2445" font-family="Arial, sans-serif" font-size="18">
    <text x="480" y="1254" text-anchor="middle">26 px GAP</text>
    <text x="480" y="2280" text-anchor="middle">26 px GAP</text>
    <text x="480" y="3306" text-anchor="middle">26 px GAP</text>
    <text x="480" y="4410" text-anchor="middle">BOTTOM DESIGN AREA / 200 px</text>
  </g>

  <g stroke="#3c2445" stroke-width="2" fill="none">
    <path d="M20 190H940M20 180V200M940 180V200"/>
    <path d="M40 236V1236M30 236H50M30 1236H50"/>
  </g>
  <g fill="#3c2445" font-family="Arial, sans-serif" font-size="18">
    <text x="480" y="184" text-anchor="middle">960 px</text>
    <text x="58" y="736" transform="rotate(-90 58 736)" text-anchor="middle">1000 px</text>
  </g>
</svg>
